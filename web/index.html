<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0B6E69">
  <title>Rounds</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-view="list">
  <header class="top">
    <button class="icon-btn menu" id="menu" aria-label="Subreddits">☰</button>
    <div class="brand"><img src="assets/icon.png" alt=""><span>Rounds</span></div>
    <label class="search"><svg viewBox="0 0 20 20" class="ico"><circle cx="9" cy="9" r="5.5" /><path d="M13 13l4 4" /></svg>
      <input id="search" type="search" placeholder="Search threads, comments, links" autocomplete="off" spellcheck="false"></label>
    <button class="icon-btn" id="sync" title="Sync now" aria-label="Sync now"><svg viewBox="0 0 20 20" class="ico"><path d="M16 10a6 6 0 01-10.4 4M4 10a6 6 0 0110.4-4M14.5 2.5V6H11M5.5 17.5V14H9" /></svg></button>
    <button class="icon-btn" id="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 20 20" class="ico"><circle cx="10" cy="10" r="2.5" /><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" /></svg></button>
  </header>

  <div class="panes">
    <nav id="sidebar" class="sidebar" aria-label="Scopes and subreddits"></nav>
    <div class="scrim" id="scrim"></div>
    <section class="list" aria-label="Threads">
      <div class="list-head">
        <div><h2 id="list-title">All threads</h2><span id="list-count" class="muted"></span></div>
        <select id="sort" aria-label="Sort">
          <option value="relevance">Relevance</option><option value="top">Top</option><option value="discussed">Most discussed</option>
        </select>
      </div>
      <div id="threads" class="threads"></div>
    </section>
    <section id="detail" class="detail" aria-label="Thread"></section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="dlg-add">
    <form id="form-add">
      <h3>Add a subreddit</h3>
      <label class="field"><span>Name or link</span><input id="add-input" placeholder="r/medicalschool" autocomplete="off" spellcheck="false"></label>
      <p id="add-error" class="error" role="alert"></p>
      <div id="add-suggest" class="chips"></div>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" id="add-ok">Add</button></div>
    </form>
  </dialog>

  <dialog id="dlg-edit">
    <form id="form-edit">
      <h3 id="edit-title"></h3>
      <label class="field"><span>Top posts from</span>
        <select id="edit-window"><option value="week">Past week</option><option value="month">Past month</option><option value="year">Past year</option><option value="all">All time</option></select></label>
      <fieldset class="field"><legend>Show</legend>
        <label class="check"><input type="checkbox" id="edit-kind-discussion"> Discussions</label>
        <label class="check"><input type="checkbox" id="edit-kind-question"> Questions</label>
        <label class="check"><input type="checkbox" id="edit-kind-resource"> Resources</label>
      </fieldset>
      <label class="field"><span>Extra keywords for this subreddit</span><input id="edit-keywords" placeholder="Comma-separated" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="edit-enabled"> Include in All threads and sync</label>
      <div class="actions"><button type="button" class="btn danger" data-action="edit-remove">Remove</button><span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Save</button></div>
    </form>
  </dialog>

  <dialog id="dlg-settings">
    <form id="form-settings">
      <h3>Settings</h3>
      <fieldset class="field"><legend>Ranking weights</legend>
        <label class="range"><span>Upvotes</span><input type="range" id="w-upvotes" min="0" max="1" step="0.05"><output id="w-upvotes-v"></output></label>
        <label class="range"><span>Discussion</span><input type="range" id="w-discussion" min="0" max="1" step="0.05"><output id="w-discussion-v"></output></label>
        <label class="range"><span>Resources</span><input type="range" id="w-resources" min="0" max="1" step="0.05"><output id="w-resources-v"></output></label>
        <label class="range"><span>Keywords</span><input type="range" id="w-keywords" min="0" max="1" step="0.05"><output id="w-keywords-v"></output></label>
      </fieldset>
      <label class="field"><span>Boost keywords</span><input id="set-keywords" placeholder="Comma-separated" autocomplete="off"></label>
      <div class="grid2">
        <label class="field"><span>Minimum upvotes</span><input id="set-minup" type="number" min="0" step="5"></label>
        <label class="field"><span>Sync</span><select id="set-interval">
          <option value="hourly">Every hour</option><option value="sixHours">Every 6 hours</option><option value="daily">Daily</option><option value="manual">Manual</option></select></label>
        <label class="field"><span>Threads per subreddit</span><select id="set-threads"><option value="100">100</option><option value="250">250</option><option value="1000">1,000</option></select></label>
        <label class="field"><span>Comments per thread</span><select id="set-comments"><option value="10">10</option><option value="20">20</option><option value="0">All</option></select></label>
      </div>
      <label class="check"><input type="checkbox" id="set-hide"> Hide image and meme posts</label>
      <p class="muted small">Threads, saved threads and settings stay in this browser. Rounds reads Reddit and never posts.</p>
      <div class="actions"><button type="button" class="btn danger" data-action="erase">Erase data</button><span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Save</button></div>
    </form>
  </dialog>

  <script src="js/core.js"></script>
  <script src="js/reddit.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
