# Optional: regenerate Rounds.xcodeproj with XcodeGen (`brew install xcodegen && xcodegen generate`).
# The checked-in project already builds; this is only a fallback.
name: Rounds
options:
  bundleIdPrefix: com.naren
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  RoundsCore:
    path: RoundsCore
targets:
  Rounds:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: RoundsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naren.rounds
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Rounds.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RoundsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RoundsCore/Tests/RoundsCoreTests
    dependencies:
      - package: RoundsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naren.rounds.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  Rounds:
    build:
      targets:
        Rounds: all
    test:
      targets: [RoundsTests]
